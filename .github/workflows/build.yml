name: Build geoip files

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 4"
  push:
    branches:
      - master
    paths:
      - "config.json"
      - ".github/workflows/build.yml"
      - "**.go"
      - "go.mod"
      - "go.sum"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Set variables
        run: |
          echo "TAG_NAME=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Build geoip.dat
        run: |
          mkdir -p output
          go build -o geoip ./
          ./geoip convert -c ./config.json
          ls -lh ./output

      - name: Generate checksum
        run: |
          cd output
          sha256sum geoip.dat > geoip.dat.sha256sum

      - name: Push files to release branch
        run: |
          cd output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add geoip.dat geoip.dat.sha256sum
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG_NAME }}" \
            ./output/geoip.dat \
            ./output/geoip.dat.sha256sum \
            --title "${{ env.RELEASE_NAME }}"
